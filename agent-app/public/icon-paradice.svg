<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f4ea8"/>
      <stop offset="1" stop-color="#6a4cb8"/>
    </linearGradient>
    <linearGradient id="screen" x1="16" y1="22" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c1322"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
  </defs>

  <!-- rounded badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" stroke="#9d6bff" stroke-opacity="0.4"/>

  <!-- monitor / agent screen -->
  <rect x="14" y="16" width="36" height="26" rx="4" fill="url(#screen)" stroke="#46b6ff" stroke-opacity="0.6"/>

  <!-- pixel agent face: two eyes + smile -->
  <rect x="23" y="25" width="4" height="5" rx="1" fill="#46b6ff"/>
  <rect x="37" y="25" width="4" height="5" rx="1" fill="#46b6ff"/>
  <path d="M25 35 q7 5 14 0" stroke="#2fe0c2" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- monitor stand -->
  <rect x="29" y="42" width="6" height="5" fill="#9d6bff"/>
  <rect x="22" y="47" width="20" height="3" rx="1.5" fill="#9d6bff"/>

  <!-- accent star (top-right) -->
  <path d="M50 12 l1.4 3.2 3.4.4-2.6 2.3.8 3.4-3-1.8-3 1.8.8-3.4-2.6-2.3 3.4-.4z" fill="#ffce4a"/>
</svg>
