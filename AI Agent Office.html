<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Agent Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Share+Tech+Mono&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  /* surfaces — black-blue */
  --bg-0:#070910;
  --bg-1:#0c0f18;
  --bg-2:#111521;
  --panel:rgba(18,22,33,0.94);
  --panel-solid:#12151f;
  --panel-head:rgba(24,29,42,0.96);
  /* lines */
  --line:#23304a;
  --line-bright:#3a6bff;
  --glow:rgba(40,90,180,0.18);
  /* accents */
  --cyan:#46b6ff;
  --blue:#4d8bff;
  --purple:#9d6bff;
  --magenta:#ff5cc8;
  --gold:#ffce4a;
  --green:#3ce594;
  --red:#ff5d72;
  /* text */
  --text:#c2cad9;
  --text-dim:#828ca5;
  --text-mute:#566074;
  --white:#eef2f8;
  /* fonts */
  --pixel:'Press Start 2P', monospace;
  --pixel2:'Silkscreen', monospace;
  --mono:'Share Tech Mono', monospace;
  --thai:'IBM Plex Sans Thai', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(1200px 700px at 18% -8%, #0e1730 0%, transparent 55%),
    radial-gradient(1100px 800px at 100% 0%, #101a36 0%, transparent 52%),
    radial-gradient(900px 600px at 50% 120%, #0b1226 0%, transparent 60%),
    var(--bg-0);
  color:var(--text);
  font-family:var(--thai);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
#root{height:100vh;width:100vw;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:rgba(8,10,18,0.5);}
::-webkit-scrollbar-thumb{background:#23304a;border-radius:0;}
::-webkit-scrollbar-thumb:hover{background:#33456a;}

/* ---------- pixel-edge panel ---------- */
.win{
  position:relative;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.03) inset,
    0 8px 24px rgba(0,0,0,0.45);
  backdrop-filter:blur(6px);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.win.accent-purple{border-color:#33406a;box-shadow:0 8px 24px rgba(0,0,0,.45);}
.win.accent-gold{border-color:#5a4d2a;box-shadow:0 8px 24px rgba(0,0,0,.45);}
.win-h{
  display:flex;align-items:center;gap:8px;
  padding:9px 11px;
  background:linear-gradient(180deg, rgba(30,36,52,0.85), rgba(18,22,33,0.6));
  border-bottom:1px solid var(--line);
}
.win-h .ttl{
  font-family:var(--pixel);
  font-size:10px;letter-spacing:1px;
  color:var(--cyan);
  text-shadow:0 0 6px rgba(70,182,255,.3);
  flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.win-h .ttl.th{font-family:var(--thai);font-weight:700;font-size:13px;letter-spacing:0;}
.win-dots{display:flex;gap:7px;align-items:center;}
.win-dots i{
  width:13px;height:13px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);color:var(--text-mute);font-size:9px;cursor:pointer;font-family:var(--mono);
  background:rgba(8,10,18,.5);
}
.win-dots i:hover{color:var(--cyan);border-color:var(--line-bright);}
.win-b{padding:12px;overflow:auto;flex:1;min-height:0;}

/* rows */
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;}
.kv + .kv{border-top:1px solid rgba(35,48,74,0.5);}
.kv .k{color:var(--text-dim);font-size:13px;}
.kv .v{font-family:var(--mono);font-size:15px;color:var(--white);letter-spacing:.3px;}
.pos{color:var(--green)!important;}
.neg{color:var(--red)!important;}
.gold{color:var(--gold)!important;}

/* pixel button */
.btn{
  font-family:var(--pixel2);font-weight:700;letter-spacing:.5px;
  font-size:12px;color:var(--white);
  background:linear-gradient(180deg,#2a3450,#1a2238);
  border:1px solid #3a466a;
  border-radius:7px;padding:9px 14px;cursor:pointer;
  box-shadow:0 2px 0 #080b14;
  transition:transform .05s, filter .15s;
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
}
.btn:hover{filter:brightness(1.18);}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 #080b14;}
.btn.green{background:linear-gradient(180deg,#1f9a5e,#13683f);border-color:#2f9e68;box-shadow:0 2px 0 #07351f;}
.btn.red{background:linear-gradient(180deg,#b53a4c,#7c2433);border-color:#b3475a;box-shadow:0 2px 0 #3d0f17;}
.btn.gold{background:linear-gradient(180deg,#c79a2c,#8c6a16);border-color:#c79a2c;color:#1a1405;box-shadow:0 2px 0 #3a2c06;}
.btn.ghost{background:rgba(20,24,36,.6);border-color:var(--line);box-shadow:none;color:var(--text-dim);}
.btn.ghost:hover{color:var(--white);border-color:var(--line-bright);}
.btn.sm{font-size:10px;padding:6px 10px;}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;}

/* chips / badges */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;
  padding:3px 8px;border-radius:5px;border:1px solid var(--line);background:rgba(20,24,36,.7);color:var(--text-dim);}
.rarity{font-family:var(--pixel);font-size:8px;letter-spacing:.5px;padding:4px 7px;border-radius:5px;color:#0a0a14;}
.r-legend{background:linear-gradient(180deg,#ffd75e,#e0962a);box-shadow:0 0 12px rgba(255,206,74,.5);}
.r-epic{background:linear-gradient(180deg,#c07bff,#8a3ce0);color:#fff;box-shadow:0 0 12px rgba(176,107,255,.5);}
.r-rare{background:linear-gradient(180deg,#4db4ff,#2a6cf0);color:#fff;box-shadow:0 0 10px rgba(77,180,255,.4);}
.r-common{background:linear-gradient(180deg,#9aa6cf,#5f6c9c);color:#fff;}

/* status dot */
.sdot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor;}
.s-working{color:var(--green);background:var(--green);}
.s-thinking{color:var(--gold);background:var(--gold);}
.s-idle{color:var(--text-mute);background:var(--text-mute);box-shadow:none;}

/* inputs */
input.fld, select.fld, textarea.fld{
  width:100%;background:rgba(8,10,18,.85);border:1px solid var(--line);border-radius:7px;
  color:var(--white);font-family:var(--thai);font-size:14px;padding:10px 12px;outline:none;
}
input.fld:focus,select.fld:focus,textarea.fld:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(70,182,255,.15);}
input.fld::placeholder,textarea.fld::placeholder{color:var(--text-mute);}
label.lbl{font-family:var(--pixel2);font-size:11px;color:var(--text-dim);letter-spacing:.5px;display:block;margin-bottom:6px;}

/* image-slot skin */
image-slot{display:block;border:1.5px dashed #33406a;border-radius:8px;background:
  repeating-linear-gradient(45deg, rgba(30,40,70,.18) 0 10px, rgba(16,20,36,.18) 10px 20px);}

/* progress */
.bar{height:8px;border-radius:5px;background:rgba(8,10,18,.8);overflow:hidden;border:1px solid var(--line);}
.bar > i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--blue));}
.bar.green > i{background:linear-gradient(90deg,#3ce594,#1f9a5e);}
.bar.gold > i{background:linear-gradient(90deg,#ffd75e,#e0962a);}
.bar.purple > i{background:linear-gradient(90deg,#c07bff,#8a3ce0);}

.scanline{position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.5;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.13) 2px 3px);}
.flicker{animation:fl 6s infinite;}
@keyframes fl{0%,97%,100%{opacity:1}98%{opacity:.85}}

/* nav */
.nav{display:flex;align-items:center;gap:6px;height:62px;padding:0 16px;flex:none;
  background:linear-gradient(180deg, rgba(18,22,33,0.96), rgba(10,12,20,0.9));
  border-bottom:1px solid var(--line);box-shadow:0 4px 20px rgba(0,0,0,.4);z-index:50;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 9px;border-radius:8px;cursor:pointer;
  color:var(--text-mute);min-width:62px;transition:.15s;border:1px solid transparent;}
.nav-item:hover{color:var(--text);background:rgba(40,52,80,.3);}
.nav-item.on{color:var(--cyan);background:rgba(40,60,110,.35);border-color:#2f456e;}
.nav-item .ic{font-size:18px;line-height:1;}
.nav-item .lb{font-family:var(--pixel);font-size:8px;letter-spacing:.5px;}

.tag{font-family:var(--pixel);font-size:8px;letter-spacing:.5px;padding:3px 6px;border-radius:4px;
  background:rgba(70,182,255,.1);color:var(--cyan);border:1px solid rgba(70,182,255,.25);}

.view{flex:1;min-height:0;overflow:auto;}
.empty{color:var(--text-mute);font-size:13px;text-align:center;padding:30px 10px;font-family:var(--mono);}
h1,h2,h3{margin:0;}
.title-xl{font-family:var(--pixel);color:var(--white);text-shadow:0 0 12px rgba(70,182,255,.25);}
a{color:var(--cyan);}

.pf-tab{font-family:var(--pixel2);font-weight:700;font-size:13px;color:var(--text-dim);
  background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 16px;cursor:pointer;transition:.15s;}
.pf-tab:hover{color:var(--text);}
.pf-tab.on{color:var(--white);background:rgba(40,60,110,.4);border-color:var(--line-bright);
  box-shadow:0 0 14px rgba(58,140,255,.2) inset;}

/* ===== WARROOM ===== */
.wr-dock{
  position:absolute;top:60px;bottom:64px;width:240px;z-index:18;
  display:flex;flex-direction:column;gap:10px;
  overflow-y:auto;overflow-x:visible;padding:2px;
  scrollbar-width:thin;
}
.wr-dock::-webkit-scrollbar{width:5px;}
.wr-dock > *{flex:none;}
.wr-speech{
  position:absolute;left:50%;top:-14px;transform:translateX(-50%) translateY(-100%);
  background:rgba(16,20,33,.96);border:1px solid #46b6ff;border-radius:10px;
  padding:6px 10px;font-size:12px;color:var(--white);white-space:nowrap;max-width:200px;
  overflow:hidden;text-overflow:ellipsis;z-index:8;box-shadow:0 6px 16px rgba(0,0,0,.5);
  animation:wrPop .18s ease-out;
}
.wr-speech-tail{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
  width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid;}
@keyframes wrPop{from{opacity:0;transform:translateX(-50%) translateY(-90%) scale(.9);}to{opacity:1;}}
</style>
</head>
<body>
<div id="root"></div>
<div class="scanline"></div>
